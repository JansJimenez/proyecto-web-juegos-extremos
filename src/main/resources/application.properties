spring.application.name=juegos-extremos
server.port=${PORT:8080}

# Estrategia de cabeceras proxy para Render (HTTPS Load Balancer)
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

# Configuracion de Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8

# Credenciales del Panel Administrativo (Backoffice)
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASS:losvegas2026}

# Datos oficiales de Juegos Extremos Los Vegas (Huayobamba - San Marcos, Cajamarca)
app.parque.nombre=Juegos Extremos Los Vegas
app.parque.ubicacion=Centro Poblado de Huayobamba, Distrito de Pedro Gálvez, San Marcos - Cajamarca
app.parque.whatsapp=${WHATSAPP_NUMBER:51953220851}
app.parque.telefonoDisplay=953 220 851
