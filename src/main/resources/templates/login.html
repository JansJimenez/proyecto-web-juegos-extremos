<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acceso Administración | Juegos Extremos "Los Vegas"</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo-los-vegas.jpg}">

    <!-- Google Fonts & FontAwesome 6 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css(v='5.0')}">

    <style>
        body {
            background-color: #faf7f2;
            color: #161917;
            padding-bottom: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-page-wrapper {
            width: 100%;
            padding: 1.5rem 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #e4dccf;
            border-radius: 28px;
            padding: 2.2rem 1.65rem;
            box-shadow: 0 20px 50px rgba(20, 26, 23, 0.09);
            text-align: center;
        }
        .login-logo {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            object-fit: cover;
            margin: 0 auto 1rem;
            border: 2.5px solid #e59819;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14);
        }
        .login-alert {
            padding: 0.85rem 1rem;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            text-align: center;
        }
        .login-alert.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }
        .login-alert.success {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }
        .login-form-group {
            text-align: left;
            margin-bottom: 1.1rem;
        }
        .login-form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #161917;
            margin-bottom: 0.4rem;
        }
    </style>
</head>
<body>

    <main class="login-page-wrapper">
        <div class="login-card">
            <img th:src="@{/images/logo-los-vegas.jpg}"
                 alt="Logo Oficial Juegos Extremos Los Vegas"
                 class="login-logo">

            <span class="editorial-kicker" style="margin-bottom: 0.3rem;">Administración Oficial</span>
            <h1 style="font-size: 1.75rem; font-weight: 800; color: #161917; line-height: 1.15;">
                Panel Los Vegas
            </h1>
            <p style="font-size: 0.86rem; color: #4a524d; margin: 0.35rem 0 1.5rem;">
                Control de clima en Huayobamba, ingresos, reservas y atracciones
            </p>

            <!-- Alertas de error o cierre de sesión -->
            <div th:if="${param.error}" class="login-alert error">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Usuario o contraseña incorrectos.</span>
            </div>

            <div th:if="${param.logout}" class="login-alert success">
                <i class="fa-solid fa-circle-check"></i>
                <span>Sesión cerrada correctamente.</span>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="login-form-group">
                    <label for="username"><i class="fa-solid fa-user-shield" style="color: #c8281e;"></i> Usuario</label>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="Ej. admin" autocomplete="username" required autofocus>
                </div>

                <div class="login-form-group" style="margin-bottom: 1.4rem;">
                    <label for="password"><i class="fa-solid fa-key" style="color: #e59819;"></i> Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="••••••••••••" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-editorial-primary" style="width: 100%; padding: 0.95rem;">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Ingresar al Panel</span>
                </button>
            </form>

            <div style="margin-top: 1.5rem; padding-top: 1.15rem; border-top: 1px solid #e4dccf;">
                <a th:href="@{/}" style="font-size: 0.86rem; color: #4a524d; font-weight: 700; display: inline-flex; align-items: center; gap: 0.45rem;">
                    <i class="fa-solid fa-arrow-left"></i> Volver a la página principal
                </a>
            </div>
        </div>
    </main>

</body>
</html>
